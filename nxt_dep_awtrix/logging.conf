[loggers]
keys=root,nxt_dep_ratp

[handlers]
keys=console

[formatters]
keys=simple

[logger_root]
level=INFO
handlers=console

[logger_nxt_dep_ratp]
level=INFO
handlers=console
qualname=nxt_dep_ratp
propagate=0

[handler_console]
class=StreamHandler
level=INFO
formatter=simple
args=(sys.stdout,)

[formatter_simple]
format=%(asctime)s %(levelname)s %(name)s: %(message)s
