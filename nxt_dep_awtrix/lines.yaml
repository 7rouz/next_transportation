# Default set of monitored lines/stops, used when the add-on's "lines" option
# is left empty (its default) and always used by scripts/check_departures.py.
# Each stop_ref/line_ref is a PRIM (IDFM) SIRI identifier - look them up via
# the PRIM stop-monitoring API or IDFM's open data stop reference.
