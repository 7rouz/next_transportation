name: "Next Bus/Train to Awtrix"
version: "1.0.0"
slug: "nxt_dep_awtrix"
description: "Fetches next RATP/IDFM (PRIM) departures and pushes them to an AWTRIX/Ulanzi TC001 display over MQTT"
arch:
  - aarch64
  - armhf
  - armv7
  - amd64
  - i386
init: false
startup: application
boot: auto
options:
  prim_api_token: ""
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  awtrix_prefix: "ulanzi_xxxxxx"
  poll_interval_seconds: 30
  lines: []
schema:
  prim_api_token: str
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  awtrix_prefix: str
  poll_interval_seconds: int
  lines:
    - line_name: str
      line_ref: str
      color: str?
      stops:
        - stop_ref: str
          stop_name: str
          destination_name: str
          destination_name_short: str?
